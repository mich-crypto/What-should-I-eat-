<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <title>What Should I Eat</title>

  <!-- Make it feel native when saved to the iPhone Home Screen -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="What2Eat" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#fff8f2" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="manifest" href="manifest.webmanifest" />

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="topbar-title" id="topbar-title">This week</div>
      <button class="icon-btn" id="btn-regenerate" title="Regenerate plan" aria-label="Regenerate plan">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 7.74 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
      </button>
    </header>

    <main id="view"></main>

    <nav class="tabbar" id="tabbar">
      <button class="tab active" data-tab="plan">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M19 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zM9 17H7v-2h2v2zm0-4H7v-2h2v2zm0-4H7V7h2v2zm4 8h-2v-2h2v2zm0-4h-2v-2h2v2zm0-4h-2V7h2v2zm4 8h-2v-2h2v2zm0-4h-2v-2h2v2zm0-4h-2V7h2v2z"/></svg>
        <span>Plan</span>
      </button>
      <button class="tab" data-tab="discover">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 21s-7.5-4.6-10-9.3C.5 8.2 2.3 4.8 5.7 4.2c2-.3 3.9.6 5 2.2 1.1-1.6 3-2.5 5-2.2 3.4.6 5.2 4 3.7 7.5C19.5 16.4 12 21 12 21z"/></svg>
        <span>Discover</span>
      </button>
      <button class="tab" data-tab="shopping">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M7 18a2 2 0 1 0 2 2 2 2 0 0 0-2-2zM1 2v2h2l3.6 7.6-1.4 2.4A2 2 0 0 0 7 17h11v-2H7l1.1-2h7.5a2 2 0 0 0 1.8-1.1L20.9 5H5.2l-.9-2H1zm16 16a2 2 0 1 0 2 2 2 2 0 0 0-2-2z"/></svg>
        <span>Shopping</span>
      </button>
      <button class="tab" data-tab="settings">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M19.4 13a7.9 7.9 0 0 0 .1-1 7.9 7.9 0 0 0-.1-1l2.1-1.6a.5.5 0 0 0 .1-.7l-2-3.5a.5.5 0 0 0-.6-.2l-2.5 1a7.7 7.7 0 0 0-1.7-1l-.4-2.6a.5.5 0 0 0-.5-.4h-4a.5.5 0 0 0-.5.4L9 4.4a7.7 7.7 0 0 0-1.7 1l-2.5-1a.5.5 0 0 0-.6.2l-2 3.5a.5.5 0 0 0 .1.7L4.6 11a7.9 7.9 0 0 0 0 2l-2.1 1.6a.5.5 0 0 0-.1.7l2 3.5a.5.5 0 0 0 .6.2l2.5-1a7.7 7.7 0 0 0 1.7 1l.4 2.6a.5.5 0 0 0 .5.4h4a.5.5 0 0 0 .5-.4l.4-2.6a7.7 7.7 0 0 0 1.7-1l2.5 1a.5.5 0 0 0 .6-.2l2-3.5a.5.5 0 0 0-.1-.7L19.4 13zM12 15.5A3.5 3.5 0 1 1 15.5 12 3.5 3.5 0 0 1 12 15.5z"/></svg>
        <span>Settings</span>
      </button>
    </nav>
  </div>

  <div id="toast" class="toast" hidden></div>

  <div id="recipe-modal" class="modal-backdrop" hidden>
    <div class="modal-sheet" id="modal-sheet"></div>
  </div>

  <div id="loading-overlay" class="loading-overlay" hidden>
    <div class="loading-card">
      <svg class="pot-anim" viewBox="0 0 120 110" width="92" height="84" aria-hidden="true">
        <g class="steam">
          <path class="steam-path s1" d="M42 44 C 37 36, 46 32, 41 22" />
          <path class="steam-path s2" d="M60 44 C 55 34, 64 30, 59 18" />
          <path class="steam-path s3" d="M78 44 C 73 36, 82 32, 77 22" />
        </g>
        <ellipse class="pot-lid" cx="60" cy="52" rx="34" ry="7" />
        <rect class="pot-knob" x="56" y="43" width="8" height="8" rx="2" />
        <path class="pot-body" d="M28 56 L92 56 L86 92 Q60 100 34 92 Z" />
        <rect class="pot-handle-l" x="13" y="58" width="17" height="9" rx="4.5" />
        <rect class="pot-handle-r" x="90" y="58" width="17" height="9" rx="4.5" />
        <circle class="bubble b1" cx="46" cy="82" r="3" />
        <circle class="bubble b2" cx="60" cy="87" r="2.5" />
        <circle class="bubble b3" cx="74" cy="80" r="3" />
      </svg>
      <div class="loading-text" id="loading-text">Cooking up something…</div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
  <script>
    // Register the offline app-shell worker, and make sure a new deploy
    // reaches this tab automatically instead of needing a manual reload:
    // check for an update whenever the app is (re)opened or comes back
    // into view, and reload once when a new service worker takes over.
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").then((reg) => {
          document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === "visible") reg.update().catch(() => {});
          });
          setInterval(() => reg.update().catch(() => {}), 60 * 60 * 1000);
        }).catch(() => {});
      });

      let reloadedForUpdate = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (reloadedForUpdate) return;
        reloadedForUpdate = true;
        location.reload();
      });
    }
  </script>
</body>
</html>
